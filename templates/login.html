<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Login</title>
<style>
 body{font-family:Arial;background:#10151c;color:#fff;display:flex;justify-content:center;padding-top:80px}
 form{background:#1d2631;padding:30px;border-radius:10px;width:280px}
 input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
 button{width:100%;padding:10px;background:#27ae60;color:#fff;border:0;border-radius:6px;cursor:pointer}
 a{color:#5dade2} .msg{color:#f1c40f}
</style></head><body>
<form method="post">
  <h2>Traffic System Login</h2>
  {% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
  <input name="username" placeholder="Username" required>
  <input name="password" type="password" placeholder="Password" required>
  <button>Login</button>
  <p>No account? <a href="/register">Register</a></p>
</form></body></html>
